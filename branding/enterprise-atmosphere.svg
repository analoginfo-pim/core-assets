<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-hidden="true">
  <!--
    AIC enterprise atmosphere  navy / steel-teal geometric wash.
    Not a product logo; decorative canvas only (low-contrast).
  -->
  <defs>
    <linearGradient id="wash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#0F6E7A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2B5F8A" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2332" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#0F6E7A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0F6E7A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="640" fill="#DCE5EC"/>
  <rect width="960" height="640" fill="url(#wash)"/>
  <rect width="960" height="640" fill="url(#grid)"/>
  <rect width="960" height="640" fill="url(#glow)"/>
  <circle cx="820" cy="520" r="200" fill="#2B5F8A" fill-opacity="0.10"/>
  <circle cx="120" cy="560" r="140" fill="#1a2332" fill-opacity="0.08"/>
</svg>

